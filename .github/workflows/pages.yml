# Publish the site/ folder to GitHub Pages on every push to main.
#
# Free GitHub Pages needs a public repository, so the job is skipped while the repository
# is private. Once it's public, turn Pages on (Settings -> Pages -> Source: GitHub Actions)
# and push, or re-run this workflow from the Actions tab.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push replaces one that's still waiting
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
