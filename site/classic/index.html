<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indiana Polluter Map</title>
  <!-- MapLibre GL JS: free, open-source map library. A copy (version 4.7.1, from the official npm
       package) is stored in vendor/, so the page doesn't depend on an outside download site. -->
  <link rel="stylesheet" href="../vendor/maplibre-gl-4.7.1/maplibre-gl.css">
  <script src="../vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #fff; }
    #map { position: absolute; inset: 0; }
    .panel {
      position: absolute; z-index: 1; background: #fff; border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 14px;
    }
    #controls { top: 10px; left: 10px; padding: 10px 12px; max-width: min(300px, calc(100% - 64px)); }
    #controls h1 { font-size: 16px; margin: 0 0 6px; }
    #controls label { display: block; margin: 3px 0; cursor: pointer; }
    #controls .group { margin-top: 8px; padding-top: 6px; border-top: 1px solid #ddd; }
    #controls .group-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
    #controls select { font: inherit; font-size: 13px; width: 100%; }
    #count, #source { color: #555; font-size: 12px; margin-top: 6px; }
    #notice { color: #8a4b00; font-size: 12px; margin-top: 6px; }
    #legend { font-size: 12px; color: #555; margin-top: 4px; }
    #legend .bar { height: 8px; border-radius: 2px; margin: 2px 0;
      background: linear-gradient(to right, rgba(255,237,160,.7), #feb24c, #fd8d3c, #f03b20, #bd0026); }
    #legend .ends { display: flex; justify-content: space-between; }

    #top { right: 10px; bottom: 30px; width: 300px; max-height: 45vh; display: flex; flex-direction: column; }
    #top h2 { font-size: 14px; margin: 0; padding: 8px 12px 6px; border-bottom: 1px solid #ddd; }
    #view-total { padding: 10px 12px; background: #7b1010; color: #fff; border-radius: 4px 4px 0 0; font-size: 13px; }
    #view-total b { font-size: 18px; display: block; }
    #top.list-hidden h2, #top.list-hidden #toplist { display: none; }
    #top.list-hidden #view-total { border-radius: 4px; }
    #top h2 small { display: block; font-weight: normal; color: #666; font-size: 11px; }
    #toplist { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
    #toplist li { display: grid; grid-template-columns: 24px 1fr auto; gap: 6px; align-items: baseline;
      padding: 5px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 13px; }
    #toplist li:hover, #toplist li:focus { background: #fdf0ef; outline: none; }
    #toplist .n { color: #999; text-align: right; }
    #toplist .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #toplist .city { display: block; color: #777; font-size: 11px; }
    #toplist .v { font-weight: 600; white-space: nowrap; }
    #toplist .empty { display: block; color: #777; cursor: default; }
    @media (max-width: 700px) {
      #top { left: 10px; right: 10px; width: auto; max-height: 32vh; }
    }

    .maplibregl-popup { z-index: 2; }   /* above the panels */
    .maplibregl-popup-content { font-size: 13px; max-height: 40vh; overflow-y: auto; }
    .maplibregl-popup-content h2 { font-size: 15px; margin: 0 0 6px; padding-right: 14px; }
    .maplibregl-popup-content h3 { font-size: 13px; margin: 10px 0 2px; border-top: 1px solid #ddd; padding-top: 6px; }
    .maplibregl-popup-content p { margin: 3px 0; }
    .maplibregl-popup-content .note { color: #666; font-size: 11px; }
    .maplibregl-popup-content .harm { color: #8b1a10; }
  </style>
  <script data-goatcounter="https://indianapollution.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div id="map"></div>

  <div id="controls" class="panel">
    <h1>Indiana regulated facilities</h1>
    <label><input type="radio" name="scope" value="major" checked> Major facilities only</label>
    <label><input type="radio" name="scope" value="all"> All facilities</label>
    <label><input type="checkbox" id="inactive"> Include inactive facilities</label>
    <div id="count">Loading…</div>

    <div class="group">
      <div class="group-title">Show</div>
      <label><input type="radio" name="view" value="dots" checked> Dots</label>
      <label><input type="radio" name="view" value="heat"> Heatmap</label>
      <div id="legend" hidden>
        <div class="bar"></div>
        <div class="ends"><span>lower</span><span id="legend-label">estimated harm</span><span>higher</span></div>
      </div>
    </div>

    <div class="group">
      <div class="group-title"><label for="metric" style="display:inline;margin:0">Rank by</label></div>
      <select id="metric"></select>
      <label><input type="checkbox" id="show-top" checked> Top 20 in view</label>
    </div>

    <div id="source"></div>
    <div id="notice" hidden></div>
  </div>

  <div id="top" class="panel">
    <div id="view-total" aria-live="polite"></div>
    <h2><span id="top-title">Top 20 in view</span><small id="top-sub"></small></h2>
    <ol id="toplist"></ol>
  </div>

  <!-- type="module" lets the code below "await" the basemap check before creating the map. -->
  <script type="module">
    // ---- 1. Create the map --------------------------------------------------
    // The basemap (streets, labels) comes from OpenFreeMap: free, no account or API key.
    // If it can't be reached (offline, or a network filter blocks it), try OpenStreetMap's own
    // tile server (also no key; fine for light use with attribution). If that fails too, use a
    // plain background so the facility dots still show.
    const BASEMAP_URL = "https://tiles.openfreemap.org/styles/positron";
    const OSM_TILES = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
    const OSM_STYLE = {
      version: 8,
      sources: {
        osm: {
          type: "raster", tiles: [OSM_TILES], tileSize: 256, maxzoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        },
      },
      // Mostly gray and a bit faded, so the red facility dots stand out.
      layers: [{ id: "osm", type: "raster", source: "osm",
                 paint: { "raster-saturation": -0.8, "raster-opacity": 0.7 } }],
    };
    const PLAIN_STYLE = {
      version: 8,
      sources: {},
      layers: [{ id: "background", type: "background", paint: { "background-color": "#f2f1ed" } }],
    };

    function showBasemapNotice() {
      const notice = document.getElementById("notice");
      notice.textContent = "Background map couldn't load on this network, so streets and labels are hidden. Facilities are still shown.";
      notice.hidden = false;
    }

    // Fetch a URL, giving up after a few seconds. no-store: really ask the server, rather than
    // trusting a copy the browser saved earlier.
    async function reachable(url) {
      const timeout = new AbortController();
      setTimeout(() => timeout.abort(), 6000);
      const response = await fetch(url, { signal: timeout.signal, cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response;
    }

    async function chooseStyle() {
      try {
        return await (await reachable(BASEMAP_URL)).json();
      } catch (err) {
        console.warn("OpenFreeMap basemap unavailable:", err);
      }
      try {
        await reachable(OSM_TILES.replace("{z}/{x}/{y}", "6/16/24"));   // one tile over Indiana
        console.info("Using backup basemap: OpenStreetMap tiles");
        return OSM_STYLE;
      } catch (err) {
        console.warn("OpenStreetMap tiles unavailable, using plain background:", err);
      }
      showBasemapNotice();
      return PLAIN_STYLE;
    }

    const map = new maplibregl.Map({
      container: "map",
      style: await chooseStyle(),
      bounds: [[-88.1, 37.77], [-84.78, 41.76]],   // Indiana: [west, south], [east, north]
      // On wide screens, leave room for the controls (left) and Top 20 list (right).
      fitBoundsOptions: { padding: window.innerWidth > 900 ? { top: 20, bottom: 20, left: 330, right: 330 } : 20 },
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");

    let allFeatures = [];   // kept so we can count and rank what's visible
    let sources = {};       // year and number of ranked facilities for each data source

    // ---- 2. Number formatting -------------------------------------------------
    const fmt = (n) => Math.round(n).toLocaleString();
    function money(n) {
      if (n >= 1e9) return `$${(n / 1e9).toFixed(n >= 1e10 ? 0 : 1)} billion`;
      if (n >= 1e6) return `$${(n / 1e6).toFixed(n >= 1e7 ? 0 : 1)} million`;
      if (n >= 1e3) return `$${fmt(n / 1e3)}K`;
      return `$${fmt(n)}`;
    }
    const shortMoney = (n) => money(n).replace(" billion", "B").replace(" million", "M");
    const big = (n) => n >= 1e6 ? `${(n / 1e6).toFixed(1)} million` : fmt(n);
    // Estimates aren't precise: round 100+ to two significant figures (26,076 -> 26,000; 351 -> 350)
    const deathsText = (n) => n >= 100 ? Number(n.toPrecision(2)).toLocaleString() : n >= 10 ? fmt(n) : n.toFixed(1);

    // ---- 3. What the heatmap and Top 20 rank by -------------------------------
    // Each metric is a property in facilities.geojson (see scripts/export_map_data.py).
    const METRICS = {
      harm_usd:    { label: "Estimated total harm ($ per year)", short: shortMoney, legend: "estimated harm" },
      total_deaths: { label: "Estimated deaths (air, toxic chemicals, climate)", short: (n) => `${deathsText(n)} deaths`, legend: "estimated deaths" },
      climate_usd: { label: "Climate damage ($ per year)", short: shortMoney, legend: "climate damage" },
      tri_lb:      { label: "Toxic chemical releases (lbs)", short: (n) => `${big(n)} lbs`, legend: "toxic releases" },
      rsei_score:  { label: "Toxic risk score (EPA RSEI)", short: (n) => fmt(n), legend: "toxic risk" },
    };
    const metricSelect = document.getElementById("metric");
    for (const [key, m] of Object.entries(METRICS)) metricSelect.add(new Option(m.label, key));
    const metric = () => metricSelect.value;
    const maxOf = {};   // largest value of each metric, to scale the heatmap

    // ---- 4. Which dots to show, based on the controls -----------------------
    // MapLibre "filter expressions" are little JSON formulas the map evaluates for every dot.
    function currentFilter() {
      const scope = document.querySelector('input[name="scope"]:checked').value;
      const includeInactive = document.getElementById("inactive").checked;
      const conditions = ["all"];
      if (scope === "major") conditions.push(["==", ["get", "major"], true]);
      if (!includeInactive) conditions.push(["==", ["get", "active"], true]);
      return conditions;
    }

    function updateFilter() {
      if (!map.getLayer("facilities")) return;   // dots not drawn yet
      map.setFilter("facilities", currentFilter());
      const scope = document.querySelector('input[name="scope"]:checked').value;
      const includeInactive = document.getElementById("inactive").checked;
      const n = allFeatures.filter(f =>
        (scope !== "major" || f.properties.major) && (includeInactive || f.properties.active)
      ).length;
      document.getElementById("count").textContent = `Showing ${n.toLocaleString()} facilities`;
    }

    // ---- 5. Heatmap ---------------------------------------------------------------
    // Glows where the chosen metric is concentrated. Weighted by the square root so one giant
    // plant doesn't drown out everything else. Fades into dots when you zoom in close.
    function heatWeight() {
      const m = metric();
      return ["/", ["sqrt", ["coalesce", ["get", m], 0]], Math.sqrt(maxOf[m] || 1)];
    }

    function setView() {
      if (!map.getLayer("heat")) return;
      const heat = document.querySelector('input[name="view"]:checked').value === "heat";
      map.setLayoutProperty("heat", "visibility", heat ? "visible" : "none");
      // In heatmap mode the ordinary dots only appear once you're zoomed in to town level.
      map.setPaintProperty("facilities", "circle-opacity",
        heat ? ["interpolate", ["linear"], ["zoom"], 10, 0, 12, 0.8] : 0.8);
      map.setPaintProperty("facilities", "circle-stroke-opacity",
        heat ? ["interpolate", ["linear"], ["zoom"], 10, 0, 12, 1] : 1);
      document.getElementById("legend").hidden = !heat;
    }

    function setMetric() {
      if (!map.getLayer("heat")) return;
      map.setFilter("heat", [">", ["coalesce", ["get", metric()], 0], 0]);
      map.setPaintProperty("heat", "heatmap-weight", heatWeight());
      document.getElementById("legend-label").textContent = METRICS[metric()].legend;
      updateTop();
    }

    // ---- 6. Top 20 in view ----------------------------------------------------------
    // Every time the map stops moving, rank the facilities currently on screen.
    // Includes all facilities with data, whatever the "major only" filter says.
    let topFeatures = [];

    function updateTop() {
      const panel = document.getElementById("top");
      const showTop = document.getElementById("show-top").checked;
      panel.classList.toggle("list-hidden", !showTop);   // the running total always stays visible
      if (!map.getSource("top")) return;
      const m = metric();
      const b = map.getBounds();

      // Running total for everything on screen
      let deaths = 0, harm = 0, n = 0;
      for (const f of allFeatures) {
        if (f.properties.harm_usd > 0 && b.contains(f.geometry.coordinates)) {
          deaths += f.properties.total_deaths || 0;
          harm += f.properties.harm_usd;
          n += 1;
        }
      }
      const total = document.getElementById("view-total");
      total.replaceChildren();
      const head = document.createElement("b");
      head.textContent = n ? `About ${deathsText(deaths)} deaths` : "No estimated harm in view";
      total.append(head, n ? `and ${money(harm)} in damage linked to one year of pollution from ` +
                             `${n.toLocaleString()} facilit${n === 1 ? "y" : "ies"} in view` : "Zoom out or pan.");

      topFeatures = showTop ? allFeatures
        .filter(f => f.properties[m] > 0 && b.contains(f.geometry.coordinates))
        .sort((a, c) => c.properties[m] - a.properties[m])
        .slice(0, 20) : [];
      map.getSource("top").setData({ type: "FeatureCollection", features: topFeatures });

      document.getElementById("top-title").textContent = `Top ${topFeatures.length || 20} in view`;
      document.getElementById("top-sub").textContent = `by ${METRICS[m].label.toLowerCase()}`;
      const list = document.getElementById("toplist");
      list.replaceChildren();
      if (!topFeatures.length) {
        const li = document.createElement("li");
        li.innerHTML = '<span class="empty">No facilities with this data in view. Zoom out or pan.</span>';
        list.append(li);
        return;
      }
      topFeatures.forEach((f, i) => {
        const li = document.createElement("li");
        li.tabIndex = 0;
        const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
        const name = document.createElement("span"); name.className = "name"; name.textContent = f.properties.name;
        const city = document.createElement("span"); city.className = "city";
        city.textContent = (f.properties.address || "").split(", ").pop();
        name.append(city);
        const v = document.createElement("span"); v.className = "v"; v.textContent = METRICS[m].short(f.properties[m]);
        li.append(n, name, v);
        li.addEventListener("mouseenter", () => map.setFilter("top-hover", ["==", ["get", "_i"], f.properties._i]));
        li.addEventListener("mouseleave", () => map.setFilter("top-hover", ["==", ["get", "_i"], -1]));
        const open = () => {
          map.flyTo({ center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 12) });
          map.once("moveend", () => showPopup(f.properties, f.geometry.coordinates));
        };
        li.addEventListener("click", open);
        li.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
        list.append(li);
      });
    }

    document.querySelectorAll('#controls input[name="scope"], #inactive').forEach(el => el.addEventListener("change", updateFilter));
    document.querySelectorAll('#controls input[name="view"]').forEach(el => el.addEventListener("change", setView));
    metricSelect.addEventListener("change", setMetric);
    document.getElementById("show-top").addEventListener("change", updateTop);
    map.on("moveend", updateTop);

    // ---- 7. Load our data and draw it -------------------------------------------------
    let dotsStarted = false;
    async function addFacilities() {
      if (dotsStarted) return;   // only once, whichever event gets here first
      dotsStarted = true;
      const geojson = await (await fetch("../data/facilities.geojson")).json();
      geojson.features.forEach((f, i) => { f.properties._i = i; });   // an id for highlighting
      allFeatures = geojson.features;
      sources = geojson.sources || {};
      for (const m of Object.keys(METRICS)) {
        maxOf[m] = Math.max(0, ...allFeatures.map(f => f.properties[m] || 0));
      }
      document.getElementById("source").textContent =
        `Sources: EPA ECHO (as of ${geojson.source_data_date}), TRI, RSEI, GHGRP, NEI, water discharge reports; ` +
        `harm estimates from EPA and IPCC factors`;

      map.addSource("facilities", { type: "geojson", data: geojson });
      map.addLayer({
        id: "heat",
        type: "heatmap",
        source: "facilities",
        layout: { visibility: "none" },
        filter: [">", ["coalesce", ["get", metric()], 0], 0],
        paint: {
          "heatmap-weight": heatWeight(),
          "heatmap-intensity": ["interpolate", ["linear"], ["zoom"], 5, 2.5, 9, 4, 12, 6],
          "heatmap-radius": ["interpolate", ["linear"], ["zoom"], 5, 18, 9, 36, 12, 55],
          "heatmap-color": ["interpolate", ["linear"], ["heatmap-density"],
            0, "rgba(255,237,160,0)", 0.05, "rgba(255,237,160,0.6)", 0.2, "#feb24c",
            0.4, "#fd8d3c", 0.6, "#f03b20", 0.85, "#bd0026", 1, "#67000d"],
          "heatmap-opacity": ["interpolate", ["linear"], ["zoom"], 10, 0.9, 12.5, 0],
        },
      });
      map.addLayer({
        id: "facilities",
        type: "circle",
        source: "facilities",
        filter: currentFilter(),
        paint: {
          // Bigger dots for major facilities, and bigger for everything as you zoom in.
          "circle-radius": ["interpolate", ["linear"], ["zoom"],
            6, ["case", ["get", "major"], 3.5, 1.5],
            12, ["case", ["get", "major"], 8, 5]],
          "circle-color": "#c0392b",
          "circle-opacity": 0.8,
          "circle-stroke-color": "#fff",
          "circle-stroke-width": 0.5,
        },
        layout: { "circle-sort-key": ["case", ["get", "major"], 1, 0] },  // majors draw on top
      });

      // The current Top 20: larger, darker dots drawn above everything else.
      map.addSource("top", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({
        id: "top-dots",
        type: "circle",
        source: "top",
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 6, 6, 12, 11],
          "circle-color": "#7b1010",
          "circle-stroke-color": "#fff",
          "circle-stroke-width": 1.5,
        },
      });
      map.addLayer({
        id: "top-hover",
        type: "circle",
        source: "top",
        filter: ["==", ["get", "_i"], -1],
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 6, 11, 12, 17],
          "circle-color": "rgba(0,0,0,0)",
          "circle-stroke-color": "#111",
          "circle-stroke-width": 3,
        },
      });

      updateFilter();
      setView();
      setMetric();
    }
    map.on("load", addFacilities);

    // Safety net: if the basemap's own pieces (street tiles, fonts, icons) get stuck, the map
    // never reports "load". After 15 seconds, switch to the plain background and draw the dots.
    setTimeout(() => {
      if (dotsStarted) return;
      console.warn("Map still loading after 15s; switching to plain background.");
      showBasemapNotice();
      map.once("style.load", addFacilities);
      map.setStyle(PLAIN_STYLE);
    }, 15000);

    // ---- 8. Click a dot -> popup -------------------------------------------
    // Built with DOM nodes + textContent (not HTML strings) so odd characters in names display safely.
    function line(label, value) {
      const p = document.createElement("p");
      const b = document.createElement("b");
      b.textContent = label + ": ";
      p.append(b, value);
      return p;
    }

    function heading(text, className) {
      const h = document.createElement("h3");
      h.textContent = text;
      if (className) h.className = className;
      return h;
    }

    function note(text) {
      const p = document.createElement("p");
      p.className = "note";
      p.textContent = text;
      return p;
    }

    function p(text) {
      const el = document.createElement("p");
      el.textContent = text;
      return el;
    }

    // "#3 of 722 in Indiana"
    const rank = (r, src) => r ? ` (#${r} of ${sources[src]?.ranked?.toLocaleString() ?? "?"} in Indiana)` : "";
    const year = (src) => sources[src]?.year ?? "";

    // Estimated harm: dollars, deaths, comparisons (scripts/build_impacts_indiana.py).
    function harmSection(f) {
      if (f.harm_usd === undefined) return [];
      const out = [heading(`Estimated yearly harm (${year("impacts")}, in ${sources.impacts?.dollar_year} dollars)`, "harm")];
      out.push(line("Total", `${money(f.harm_usd)} a year (range ${money(f.harm_lo)}–${money(f.harm_hi)})${rank(f.harm_rank, "impacts")}`));
      out.push(line("That's per day", money(f.harm_usd / 365)));
      if (f.total_deaths) {
        out.push(line("Deaths linked to one year of its pollution",
          `about ${deathsText(f.total_deaths)} (range ${deathsText(f.total_deaths_lo || 0)}–${deathsText(f.total_deaths_hi)})` +
          rank(f.death_rank, "impacts")));
        const parts = [];
        if (f.deaths) parts.push(`${deathsText(f.deaths)} from air pollution, mostly in and near Indiana`);
        if (f.climate_deaths) parts.push(`${deathsText(f.climate_deaths)} from climate change, worldwide through 2100`);
        out.push(p(parts.join(" · ")));
      }
      const ill = [[f.ill_lung_cancer, "lung cancers"], [f.ill_heart_stroke, "heart attacks and strokes"],
                   [f.ill_asthma, "new asthma cases"], [f.ill_hospital, "ER visits and hospital stays"]]
        .filter(([n]) => n >= 1).map(([n, label]) => `${fmt(n)} ${label}`);
      if (ill.length) out.push(line("Also linked to, each year", ill.join(" · ")));
      if (f.health_usd) out.push(line("Health damage", money(f.health_usd)));
      if (f.climate_usd) out.push(line("Climate damage", `${money(f.climate_usd)} (range ${money(f.climate_lo)}–${money(f.climate_hi)})`));
      if (f.removal_lo) out.push(line("Cost to remove its CO2 from the air", `${money(f.removal_lo)}–${money(f.removal_hi)}`));
      if (f.eq_cars) out.push(line("Same CO2 as", `${big(f.eq_cars)} cars driven for a year, or ${big(f.eq_homes)} homes' energy use`));
      out.push(line("Penalties in the last 5 years", f.penalties_usd ? money(f.penalties_usd) : "$0 on this record"));
      if (f.harm_outlier) out.push(note(f.harm_outlier));
      out.push(note("Screening estimates using EPA and IPCC factors, for comparing facilities. Covers deaths and illness from air pollution, and climate damage; toxic chemicals and water pollution aren't included."));
      return out;
    }

    // One section per extra data source -- only shown when the facility has that data.
    function extraSections(f) {
      const out = [];

      if (f.tri_lb !== undefined) {   // toxic releases
        out.push(heading(`Toxic chemical releases (TRI ${year("tri")})`));
        if (f.tri_lb > 0) {
          out.push(line("Released", `${fmt(f.tri_lb)} lbs${rank(f.tri_rank, "tri")}`));
          out.push(line("Where", `air ${fmt(f.tri_air_lb || 0)} · water ${fmt(f.tri_water_lb || 0)} · ` +
                                 `land ${fmt(f.tri_land_lb || 0)} · sent off-site ${fmt(f.tri_offsite_lb || 0)} lbs`));
          if (f.tri_carcinogen_lb > 0) out.push(line("Of which cancer-causing", `${fmt(f.tri_carcinogen_lb)} lbs`));
          if (f.tri_top_chemical) out.push(line("Largest", f.tri_top_chemical.split(" (")[0]));
        } else {
          out.push(p("Reported, but no release amounts"));
        }
        if (f.tri_form_a > 0) out.push(note(`${f.tri_form_a} chemical(s) filed on EPA's short form, which doesn't state amounts.`));
      }

      if (f.rsei_score !== undefined) {   // risk-weighted toxics
        out.push(heading(`Toxic risk score (EPA RSEI ${year("rsei")})`));
        out.push(line("Risk rank", `#${f.rsei_rank} of ${sources.rsei?.ranked?.toLocaleString()} in Indiana`));
        if (f.rsei_cancer_pct !== undefined) out.push(line("From cancer-causing chemicals", `${f.rsei_cancer_pct}%`));
        out.push(note("Weighs each release by toxicity and how many people may be exposed. A screening estimate, not a measured health risk."));
      }

      if (f.ghg_t !== undefined) {   // greenhouse gases
        out.push(heading(`Greenhouse gases (${year("ghg")})`));
        out.push(line("Emitted", `${fmt(f.ghg_t)} metric tons CO2-equivalent${rank(f.ghg_rank, "ghg")}`));
      }

      if (f.nei_pm25_t !== undefined || f.nei_so2_t !== undefined || f.nei_nox_t !== undefined) {   // air pollutants
        out.push(heading(`Air pollutants (EPA NEI ${year("nei")})`));
        if (f.nei_pm25_t !== undefined) out.push(line("Fine particles (PM2.5)", `${f.nei_pm25_t.toLocaleString()} tons${rank(f.nei_pm25_rank, "nei")}`));
        if (f.nei_so2_t !== undefined) out.push(line("Sulfur dioxide", `${f.nei_so2_t.toLocaleString()} tons`));
        if (f.nei_nox_t !== undefined) out.push(line("Nitrogen oxides", `${f.nei_nox_t.toLocaleString()} tons`));
        if (f.nei_hap_lb > 0) out.push(line("Toxic air pollutants", `${fmt(f.nei_hap_lb)} lbs`));
      }

      if (f.water_twpe !== undefined || f.water_exceedances > 0) {   // water
        out.push(heading(`Water discharges (${year("water")})`));
        if (f.water_twpe > 0) out.push(line("Toxic-weighted discharge", `${fmt(f.water_twpe)} lb-equivalents${rank(f.water_twpe_rank, "water")}`));
        if (f.water_lb > 0) out.push(line("All pollutants", `${fmt(f.water_lb)} lbs`));
        out.push(line("Permit limits exceeded", `${f.water_exceedances || 0} time(s)`));
        if (f.water_late_reports > 0) out.push(line("Late or missing reports", f.water_late_reports));
        if (f.water_impaired) out.push(line("Discharges into impaired water", f.water_impaired));
      }

      return out;
    }

    function showPopup(f, coordinates) {
      const box = document.createElement("div");

      const h = document.createElement("h2");
      h.textContent = f.name;
      box.append(h);
      if (f.address) box.append(line("Address", f.address));
      box.append(line("Industry", f.industry || "Not reported"));
      box.append(line("Regulated for", f.programs || "None listed"));

      let status = f.status || "Not available";
      if (f.qtrs_violation > 0) status += ` (in violation ${f.qtrs_violation} of the last 12 quarters)`;
      box.append(line("Compliance", status));
      box.append(line("Major facility", f.major ? "Yes" : "No"));
      if (!f.active) box.append(line("Permits", "Inactive"));
      box.append(...harmSection(f), ...extraSections(f));

      if (f.report_url) {
        const a = document.createElement("a");
        a.href = f.report_url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "Full EPA facility report ↗";
        const para = document.createElement("p");
        para.append(a);
        box.append(para);
      }

      // focusAfterOpen: false -- otherwise MapLibre focuses the report link at the bottom and the
      // popup opens scrolled down past the facility name.
      new maplibregl.Popup({ maxWidth: "320px", focusAfterOpen: false })
        .setLngLat(coordinates).setDOMContent(box).addTo(map);
    }

    // Top-20 dots sit above the ordinary dots, so check them first; one popup per click.
    map.on("click", (e) => {
      const hits = map.queryRenderedFeatures(e.point, { layers: ["top-dots", "facilities"].filter(l => map.getLayer(l)) });
      if (hits.length) showPopup(hits[0].properties, hits[0].geometry.coordinates);
    });
    for (const layer of ["facilities", "top-dots"]) {
      map.on("mouseenter", layer, () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", layer, () => map.getCanvas().style.cursor = "");
    }
  </script>
</body>
</html>
